[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "documentacion"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI Depends()/frozen-dataclass defaults are intentional; B905: zip over equal-length columns.
ignore = ["B008", "B905"]

[tool.black]
target-version = ["py311"]
line-length = 120
extend-exclude = "/(data|documentacion)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["application", "domain", "infrastructure"]
omit = ["infrastructure/scripts/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
