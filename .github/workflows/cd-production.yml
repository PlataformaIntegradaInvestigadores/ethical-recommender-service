name: "CD — ethical-recommender-service → Producción"

on:
  push:
    branches: [main]

jobs:
  # ── Control de calidad ────────────────────────────────────────────────────
  quality:
    name: Control de calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: ruff check
        run: python -m ruff check .
      - name: black --check
        run: python -m black --check .
      - name: Ejecutar tests
        run: |
          python -m pytest --cov --cov-report=term-missing \
            --cov-report=xml:coverage-prod.xml --junitxml=report-prod.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-results-prod
          path: |
            report-prod.xml
            coverage-prod.xml
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Build de la imagen
        run: docker build -t ethical-recommender-service:${{ github.sha }} .

  # ── Deploy producción ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy a servidor producción
    runs-on: [self-hosted, production]
    needs: quality
    steps:
      - name: Actualizar código
        run: |
          cd /opt/centinela/ethical-recommender-service
          git fetch origin main
          git reset --hard origin/main

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela/ethical-recommender-service
          docker compose up -d --build --remove-orphans

      - name: Health check con rollback automático
        run: |
          sleep 10
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8007/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback al commit anterior"
            cd /opt/centinela/ethical-recommender-service && git reset --hard HEAD~1
            docker compose up -d --build --remove-orphans
            exit 1
          fi
          echo "Deploy exitoso — ethical-recommender-service en producción"
