name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    uses: PlataformaIntegradaInvestigadores/.github/.github/workflows/branch-name.yml@main

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-results
          path: |
            report.xml
            coverage.xml
      - run: docker compose config --quiet
      - run: docker build -t ethical-recommender-service:${{ github.sha }} .

  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: quality
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/ethical-recommender-service
          git fetch origin develop
          git reset --hard origin/develop

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela/ethical-recommender-service
          docker compose up -d --build --remove-orphans

      - name: Health check
        run: |
          sleep 10
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8007/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido - rollback"
            cd /opt/centinela/ethical-recommender-service && git reset --hard HEAD~1
            docker compose up -d --build --remove-orphans
            exit 1
          fi
